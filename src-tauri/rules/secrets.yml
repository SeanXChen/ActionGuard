# ActionGuard community rules — sensitive assets
# These rules apply to file read/modify/delete operations and to shell
# commands that would read a sensitive path (cat, less, vim, etc.).
version: 1
scope: secret
rules:
  - id: deny-write-env
    match:
      category: file
      path: "*.env"
    action: deny
    risk: critical
    reason: "Modifying .env files changes the application's secrets"

  - id: deny-write-env-variant
    match:
      category: file
      path: ".env.*"
    action: deny
    risk: critical
    reason: "Modifying environment files changes the application's secrets"

  - id: deny-delete-pem
    match:
      category: file
      path: "*.pem"
    action: deny
    risk: critical
    reason: "Removing a TLS/SSL private key"

  - id: deny-delete-key
    match:
      category: file
      path: "*.key"
    action: deny
    risk: critical
    reason: "Removing a private key file"

  - id: deny-write-ssh-id
    match:
      category: file
      path: "id_rsa"
    action: deny
    risk: critical
    reason: "Modifying an SSH private key"

  - id: deny-write-ssh-id-ed25519
    match:
      category: file
      path: "id_ed25519"
    action: deny
    risk: critical
    reason: "Modifying an SSH private key"

  - id: deny-write-aws-creds
    match:
      category: file
      path: ".aws/*"
    action: deny
    risk: critical
    reason: "Modifying AWS credentials"

  - id: deny-write-gnupg
    match:
      category: file
      path: ".gnupg/**"
    action: deny
    risk: critical
    reason: "Modifying the GPG keyring"

  - id: deny-write-credentials
    match:
      category: file
      path: "credentials.*"
    action: deny
    risk: critical
    reason: "Modifying a credentials file"

  # ---------- shell reads of sensitive files ----------
  - id: confirm-cat-env
    match:
      category: shell
      command: cat
      args_contains: [".env"]
    action: ask
    risk: critical
    reason: "Reading an env file exposes secrets to the agent"

  - id: confirm-cat-env-prod
    match:
      category: shell
      command: cat
      args_contains: [".env.production"]
    action: ask
    risk: critical
    reason: "Reading a production env file exposes secrets to the agent"

  - id: confirm-cat-env-local
    match:
      category: shell
      command: cat
      args_contains: [".env.local"]
    action: ask
    risk: critical
    reason: "Reading a local env file exposes secrets to the agent"

  - id: confirm-cat-pem
    match:
      category: shell
      command: cat
      args_contains: [".pem"]
    action: ask
    risk: critical
    reason: "Reading a PEM private key file exposes secrets to the agent"

  - id: confirm-cat-key
    match:
      category: shell
      command: cat
      args_contains: [".key"]
    action: ask
    risk: critical
    reason: "Reading a private key file exposes secrets to the agent"

  - id: confirm-cat-id-rsa
    match:
      category: shell
      command: cat
      args_contains: ["id_rsa"]
    action: ask
    risk: critical
    reason: "Reading an SSH private key exposes secrets to the agent"

  - id: confirm-cat-id-ed25519
    match:
      category: shell
      command: cat
      args_contains: ["id_ed25519"]
    action: ask
    risk: critical
    reason: "Reading an SSH private key exposes secrets to the agent"

  - id: confirm-cat-credentials-json
    match:
      category: shell
      command: cat
      args_contains: ["credentials.json"]
    action: ask
    risk: critical
    reason: "Reading credentials file"

  - id: confirm-cat-credentials-yml
    match:
      category: shell
      command: cat
      args_contains: ["credentials.yml"]
    action: ask
    risk: critical
    reason: "Reading credentials file"
