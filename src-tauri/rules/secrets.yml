# ActionGuard community rules — sensitive assets
# ================================================================
#
# This file covers the "Secret Classes" from the v0.2 adversarial
# analysis: Read → Collect → Transform → Transmit.
#
# v0.2 covers:
#   Read:    credential-path file reads + shell reads of sensitive files
#   Collect: credential directory traversal (ssh/, .aws/, etc.)
#   Transform: archive creation of credential dirs (observed, not enforced)
#   Transmit: outbound network attempts (observed only; v0.2 Network out of scope)
#
# The session risk engine (Phase P1) correlates these into chains:
#   credential_sources_touched + aggregation → potential exfiltration
#
# Credential classes tracked (→ SessionSummary.credential_types):
#   ssh_private_key   ~/.ssh/id_rsa, id_ed25519, etc.
#   aws_credentials   ~/.aws/credentials, config
#   git_credentials   ~/.git-credentials, .gitconfig with tokens
#   api_token         .env, .env.*, *token*, *secret*, credentials.*
#   shell_history     .bash_history, .zsh_history, PowerShell history
#   cloud_creds       gcloud, azure, digitalocean configs
#   system_secret     .gnupg/, .pki/, CA certificates
#
version: 1
scope: secret
rules:

  # ================================================================
  # WRITE rules — deny modifying existing secrets
  # ================================================================
  - id: deny-write-env
    match:
      category: file
      path: "*.env"
    action: deny
    risk: critical
    reason: "Modifying .env files changes the application's secrets"

  - id: deny-write-env-variant
    match:
      category: file
      path: ".env.*"
    action: deny
    risk: critical
    reason: "Modifying environment files changes the application's secrets"

  - id: deny-write-credentials
    match:
      category: file
      path: "credentials.*"
    action: deny
    risk: critical
    reason: "Modifying a credentials file"

  - id: deny-write-token-file
    match:
      category: file
      path: "*token*"
    action: deny
    risk: critical
    reason: "Modifying a token file"

  - id: deny-write-secret-file
    match:
      category: file
      path: "*secret*"
    action: deny
    risk: critical
    reason: "Modifying a secret file"

  - id: deny-delete-pem
    match:
      category: file
      path: "*.pem"
    action: deny
    risk: critical
    reason: "Removing a TLS/SSL private key"

  - id: deny-delete-key
    match:
      category: file
      path: "*.key"
    action: deny
    risk: critical
    reason: "Removing a private key file"

  - id: deny-write-ssh-id
    match:
      category: file
      path: "id_rsa"
    action: deny
    risk: critical
    reason: "Modifying an SSH private key"

  - id: deny-write-ssh-id-ed25519
    match:
      category: file
      path: "id_ed25519"
    action: deny
    risk: critical
    reason: "Modifying an SSH private key"

  - id: deny-write-aws-creds
    match:
      category: file
      path: ".aws/*"
    action: deny
    risk: critical
    reason: "Modifying AWS credentials"

  - id: deny-write-gnupg
    match:
      category: file
      path: ".gnupg/**"
    action: deny
    risk: critical
    reason: "Modifying the GPG keyring"

  # ================================================================
  # READ rules — credential exfiltration starts here (Read phase)
  # ================================================================

  # --- Shell history (often contains tokens, credentials, server names) ---
  - id: read-shell-history
    match:
      category: shell
      command: cat
      args_contains: [".bash_history"]
    action: ask
    risk: critical
    reason: "Shell history often contains credentials, tokens, and server names"

  - id: read-zsh-history
    match:
      category: shell
      command: cat
      args_contains: [".zsh_history"]
    action: ask
    risk: critical
    reason: "Zsh history often contains credentials and server access patterns"

  - id: read-powershell-history
    match:
      category: shell
      command: cat
      args_any:
        - "ConsoleHost_history.txt"
        - "history"
    action: ask
    risk: high
    reason: "PowerShell history may contain credentials and commands"

  # --- SSH private keys ---
  - id: read-ssh-private-key
    match:
      category: shell
      command: cat
      args_contains: ["id_rsa"]
    action: ask
    risk: critical
    reason: "Reading an SSH private key enables server impersonation"

  - id: read-ssh-ed25519-key
    match:
      category: shell
      command: cat
      args_contains: ["id_ed25519"]
    action: ask
    risk: critical
    reason: "Reading an SSH Ed25519 private key enables server impersonation"

  - id: read-any-ssh-key
    match:
      category: shell
      command: cat
      args_contains: [".ssh/"]
    action: ask
    risk: critical
    reason: "Reading files from .ssh/ may expose private keys"

  # --- AWS / cloud credentials ---
  - id: read-aws-credentials
    match:
      category: shell
      command: cat
      args_any:
        - ".aws/credentials"
        - ".aws/config"
    action: ask
    risk: critical
    reason: "AWS credentials enable cloud account access"

  - id: read-gcloud-credentials
    match:
      category: shell
      command: cat
      args_any:
        - "gcloud/"
        - "application_default_credentials.json"
    action: ask
    risk: critical
    reason: "Google Cloud credentials enable GCP account access"

  - id: read-azure-credentials
    match:
      category: shell
      command: cat
      args_any:
        - ".azure/"
        - "azureProfile.json"
    action: ask
    risk: critical
    reason: "Azure credentials enable Microsoft cloud account access"

  # --- API tokens / env files ---
  - id: read-env-file
    match:
      category: shell
      command: cat
      args_contains: [".env"]
    action: ask
    risk: critical
    reason: "Env files expose application secrets and API keys"

  - id: read-env-prod
    match:
      category: shell
      command: cat
      args_any:
        - ".env.production"
        - ".env.prod"
    action: ask
    risk: critical
    reason: "Production env files expose live service credentials"

  - id: read-env-local
    match:
      category: shell
      command: cat
      args_any:
        - ".env.local"
        - ".env.development"
    action: ask
    risk: high
    reason: "Local env files may expose development credentials"

  # --- Git credentials ---
  - id: read-git-credentials
    match:
      category: shell
      command: cat
      args_any:
        - ".git-credentials"
        - ".gitconfig"
    action: ask
    risk: high
    reason: "Git credentials enable repository authentication"

  - id: read-netrc
    match:
      category: shell
      command: cat
      args_contains: [".netrc"]
    action: ask
    risk: critical
    reason: ".netrc files store plaintext credentials for remote access"

  # --- General credential files ---
  - id: read-pem-key
    match:
      category: shell
      command: cat
      args_contains: [".pem"]
    action: ask
    risk: critical
    reason: "Reading a PEM private key exposes cryptographic secrets"

  - id: read-private-key
    match:
      category: shell
      command: cat
      args_contains: [".key"]
    action: ask
    risk: critical
    reason: "Reading a private key exposes cryptographic secrets"

  - id: read-credentials-json
    match:
      category: shell
      command: cat
      args_contains: ["credentials.json"]
    action: ask
    risk: critical
    reason: "credentials.json may contain API or service credentials"

  - id: read-credentials-yml
    match:
      category: shell
      command: cat
      args_contains: ["credentials.yml"]
    action: ask
    risk: critical
    reason: "credentials.yml may contain API or service credentials"

  - id: read-credentials-yaml
    match:
      category: shell
      command: cat
      args_contains: ["credentials.yaml"]
    action: ask
    risk: critical
    reason: "credentials.yaml may contain API or service credentials"

  - id: read-service-account-key
    match:
      category: shell
      command: cat
      args_any:
        - "service-account"
        - "sa_key"
    action: ask
    risk: critical
    reason: "Service account keys provide cloud API access"

  # ================================================================
  # Aggregation — Transform phase (observed, not enforced in v0.2)
  # These trigger after credential access in the same session.
  # ================================================================
  - id: archive-credential-dir
    match:
      category: shell
      command: tar
      args_any:
        - ".ssh"
        - ".aws"
        - ".gnupg"
        - ".git-credentials"
    action: ask
    risk: critical
    reason: "Archiving credential directories suggests exfiltration preparation"

  - id: archive-home-secrets
    match:
      category: shell
      command: tar
      args_any:
        - ".ssh"
        - ".aws"
        - ".gnupg"
    action: ask
    risk: critical
    reason: "Archiving home directory secrets suggests credential collection"

  - id: zip-credential-dir
    match:
      category: shell
      command: zip
      args_any:
        - ".ssh"
        - ".aws"
        - ".gnupg"
    action: ask
    risk: critical
    reason: "Zipping credential directories suggests exfiltration preparation"

  # ================================================================
  # Transmit — outbound network attempts (observe-only in v0.2)
  # v0.2 Network enforcement is out of scope; these are logged.
  # Future (P2): these escalate session risk to "chain detected".
  # ================================================================
  - id: curl-with-credential-data
    match:
      category: shell
      command: curl
      args_any:
        - "-d"
        - "--data"
        - "-X POST"
        - "-H"
    action: ask
    risk: high
    reason: "Outbound HTTP POST after credential access may be exfiltration"

  - id: wget-exfil
    match:
      category: shell
      command: wget
      args_any:
        - "--post-data"
        - "--post-file"
    action: ask
    risk: high
    reason: "HTTP POST via wget after credential access may be exfiltration"

  - id: nc-exfil
    match:
      category: shell
      command: nc
      args_any:
        - "-e"
        - "/dev/tcp"
    action: ask
    risk: critical
    reason: "netcat with exec flag enables direct data exfiltration"
